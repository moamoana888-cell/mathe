    <style>

            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .font-fredoka {
            font-family: 'Fredoka', sans-serif;
        }

            transform: rotate(180deg);

        }

            transform: scale(0.95);
        }

            animation: shake 0.4s ease-in-out;
        }

            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        .pop-in {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }

</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center overflow-x-hidden p-2 sm:p-4">

    <!-- Web Audio API Sound Generator -->
    <script>
        class SoundFX {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playTone(freq, type, duration, vol = 0.1) {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            correct() {
                this.playTone(523.25, 'sine', 0.1, 0.15); // C5
                setTimeout(() => this.playTone(659.25, 'sine', 0.15, 0.15), 80); // E5
                setTimeout(() => this.playTone(783.99, 'sine', 0.25, 0.2), 160); // G5
            }
            wrong() {
                this.playTone(220, 'sawtooth', 0.15, 0.2);
                setTimeout(() => this.playTone(180, 'sawtooth', 0.25, 0.2), 100);
            }
            click() {
                this.playTone(400, 'triangle', 0.05, 0.05);
            }
            win() {
                const notes = [400, 500, 600, 800, 1000];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.2, 0.15), idx * 100);
                });
            }
        }
        const sound = new SoundFX();
    </script>

    <!-- Main Container -->
    <div id="app" class="w-full max-w-4xl min-h-[90vh] flex flex-col justify-center items-center relative">

        <!-- ================= MAIN MENU ================= -->
        <div id="main-menu" class="w-full max-w-md bg-slate-800 rounded-3xl p-6 sm:p-8 border-4 border-indigo-500/30 shadow-2xl text-center space-y-6 pop-in">

                    <button onclick="quitGame()" class="flex-1 py-4 bg-slate-700 hover:bg-slate-600 font-bold rounded-2xl text-slate-300 btn-bounce">

    <!-- JavaScript Logic -->
    <script>
        // Game State
        let currentMode = 'duel'; // 'vs-ai', 'duel', 'speed'
        let selectedCategory = 'add';
        let aiDifficulty = 'medium'; // 'easy', 'medium', 'hard'
        let gameTimer = null;
        let aiLoopTimer = null;
        let timeLeft = 60;

        // Player states
        let p1 = { score: 0, combo: 0, currentAns: null, question: '' };
        let p2 = { score: 0, combo: 0, currentAns: null, question: '' };

        // Category Selection
        function selectCategory(cat, btn) {
            sound.click();
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.remove('bg-indigo-600', 'border-indigo-400');
                b.classList.add('bg-slate-700', 'border-transparent');
            });
            btn.classList.remove('bg-slate-700', 'border-transparent');
            btn.classList.add('bg-indigo-600', 'border-indigo-400');
        }

        // Show AI diff options
        function showAIDifficulty() {
            sound.click();
            const container = document.getElementById('ai-diff-container');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
            } else {
                startGame('vs-ai');
            }
        }

        // AI Diff selection
        function selectDiff(diff, btn) {
            sound.click();
            aiDifficulty = diff;
            document.querySelectorAll('.diff-btn').forEach(b => {
                b.classList.remove('bg-emerald-600', 'border-emerald-400');
                b.classList.add('bg-slate-700', 'border-transparent');
            });
            btn.classList.remove('bg-slate-700', 'border-transparent');
            btn.classList.add('bg-emerald-600', 'border-emerald-400');
            startGame('vs-ai');
        }

        // Start Game Init
        function startGame(mode) {
            sound.click();
            currentMode = mode;
            p1 = { score: 0, combo: 0, currentAns: null, question: '' };
            p2 = { score: 0, combo: 0, currentAns: null, question: '' };

            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-over-modal').classList.add('hidden');

            if (mode === 'duel' || mode === 'vs-ai') {
                document.getElementById('duel-screen').classList.remove('hidden');
                document.getElementById('speed-screen').classList.add('hidden');

                const p1Name = document.getElementById('p1-name');
                const p1Zone = document.getElementById('p1-zone');

                if (mode === 'vs-ai') {
                    p1Name.innerHTML = `<i class="fa-solid fa-robot text-indigo-400"></i> Бот (${getDiffName(aiDifficulty)})`;
                    p1Zone.classList.remove('rotated-p1'); // Keep upright if playing against bot
                    startAIBot();
                } else {
                    p1Name.innerHTML = `<i class="fa-solid fa-user text-indigo-400"></i> Тоглогч 1`;
                    p1Zone.classList.add('rotated-p1'); // Rotate for split screen face-to-face
                }

                updateScores();
                nextQuestion(1);
                nextQuestion(2);
                startTimer(60);

            } else if (mode === 'speed') {
                document.getElementById('duel-screen').classList.add('hidden');
                document.getElementById('speed-screen').classList.remove('hidden');
                updateScores();
                nextQuestion(2); // Use p2 state for single speed run
                startTimer(60);
            }
        }

        function getDiffName(diff) {
            if (diff === 'easy') return 'Хялбар';
            if (diff === 'medium') return 'Дунд';
            return 'Хүнд';
        }

        // Timer
        function startTimer(seconds) {
            clearInterval(gameTimer);
            timeLeft = seconds;
            updateTimerUI();

            gameTimer = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    endGame();
                }
            }, 1000);
        }

        function updateTimerUI() {
            if (currentMode === 'speed') {
                document.getElementById('speed-timer').textContent = `${timeLeft}s`;
            } else {
                document.getElementById('timer-text').textContent = `${timeLeft}s`;
            }
        }

        // Math Generator
        function generateMathProblem() {
            let ops = ['+', '-', '*', '/'];
            if (selectedCategory === 'add') ops = ['+'];
            if (selectedCategory === 'sub') ops = ['-'];
            if (selectedCategory === 'mul') ops = ['*'];
            if (selectedCategory === 'div') ops = ['/'];

            const op = ops[Math.floor(Math.random() * ops.length)];
            let num1, num2, answer;

            switch (op) {
                case '+':
                    num1 = Math.floor(Math.random() * 20) + 1;
                    num2 = Math.floor(Math.random() * 20) + 1;
                    answer = num1 + num2;
                    break;
                case '-':
                    num1 = Math.floor(Math.random() * 25) + 5;
                    num2 = Math.floor(Math.random() * num1) + 1;
                    answer = num1 - num2;
                    break;
                case '*':
                    num1 = Math.floor(Math.random() * 10) + 1;
                    num2 = Math.floor(Math.random() * 10) + 1;
                    answer = num1 * num2;
                    break;
                case '/':
                    num2 = Math.floor(Math.random() * 9) + 2;
                    answer = Math.floor(Math.random() * 10) + 1;
                    num1 = num2 * answer;
                    break;
            }

            // Generate options
            let options = new Set([answer]);
            while (options.size < 4) {
                let offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                let wrongAns = answer + offset;
                if (wrongAns >= 0) options.add(wrongAns);
            }

            const symbols = { '+': '+', '-': '-', '*': '×', '/': '÷' };

            return {
                text: `${num1} ${symbols[op]} ${num2} = ?`,
                answer: answer,
                options: Array.from(options).sort(() => Math.random() - 0.5)
            };
        }

        // Render Question
        function nextQuestion(playerNum) {
            const prob = generateMathProblem();
            if (playerNum === 1) {
                p1.currentAns = prob.answer;
                p1.question = prob.text;
                document.getElementById('p1-question').textContent = prob.text;
                renderAnswers('p1-answers', prob.options, 1);
            } else {
                p2.currentAns = prob.answer;
                p2.question = prob.text;
                if (currentMode === 'speed') {
                    document.getElementById('speed-question').textContent = prob.text;
                    renderAnswers('speed-answers', prob.options, 2);
                } else {
                    document.getElementById('p2-question').textContent = prob.text;
                    renderAnswers('p2-answers', prob.options, 2);
                }
            }
        }

        function renderAnswers(elementId, options, playerNum) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = `w-full py-3 sm:py-5 bg-slate-700/80 hover:bg-slate-600 text-white font-black text-xl sm:text-2xl rounded-2xl border-2 border-slate-600 btn-bounce shadow-lg`;
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(playerNum, opt, btn);
                container.appendChild(btn);
            });
        }

        // Check Answer
        function checkAnswer(playerNum, selected, btnElement) {
            const p = playerNum === 1 ? p1 : p2;

            if (selected === p.currentAns) {
                sound.correct();
                p.combo += 1;
                p.score += 10 + (p.combo * 2);

                btnElement.classList.remove('bg-slate-700/80');
                btnElement.classList.add('bg-emerald-600', 'border-emerald-400');

                setTimeout(() => {
                    updateScores();
                    nextQuestion(playerNum);
                }, 150);

            } else {
                sound.wrong();
                p.combo = 0;
                p.score = Math.max(0, p.score - 5);

                btnElement.classList.remove('bg-slate-700/80');
                btnElement.classList.add('bg-rose-600', 'border-rose-400', 'shake');

                setTimeout(() => {
                    updateScores();
                    nextQuestion(playerNum);
                }, 300);
            }
        }

        // AI Logic
        function startAIBot() {
            clearInterval(aiLoopTimer);
            let speedMs = 3500;
            let accuracy = 0.6;

            if (aiDifficulty === 'medium') { speedMs = 2500; accuracy = 0.8; }
            if (aiDifficulty === 'hard') { speedMs = 1600; accuracy = 0.95; }

            aiLoopTimer = setInterval(() => {
                if (currentMode !== 'vs-ai' || timeLeft <= 0) return;

                const isCorrect = Math.random() < accuracy;
                if (isCorrect) {
                    p1.combo += 1;
                    p1.score += 10 + (p1.combo * 2);
                    sound.correct();
                } else {
                    p1.combo = 0;
                    p1.score = Math.max(0, p1.score - 5);
                }

                updateScores();
                nextQuestion(1);

            }, speedMs);
        }

        // Update Scores UI
        function updateScores() {
            if (currentMode === 'speed') {
                document.getElementById('speed-score').textContent = p2.score;
                document.getElementById('speed-combo').textContent = `x${p2.combo}`;
            } else {
                document.getElementById('p1-score').textContent = p1.score;
                document.getElementById('p1-combo').textContent = `Combo: x${p1.combo}`;
                document.getElementById('p2-score').textContent = p2.score;
                document.getElementById('p2-combo').textContent = `Combo: x${p2.combo}`;
            }
        }

        // End Game
        function endGame() {
            sound.win();
            clearInterval(gameTimer);
            clearInterval(aiLoopTimer);

            const modal = document.getElementById('game-over-modal');
            const winnerTitle = document.getElementById('winner-title');
            const winnerSub = document.getElementById('winner-subtitle');
            const summary1 = document.getElementById('score-summary-1');
            const summary2 = document.getElementById('score-summary-2');

            modal.classList.remove('hidden');

            if (currentMode === 'speed') {
                winnerTitle.textContent = "ЦАГ ДУУСЛАА!";
                winnerSub.textContent = `Та 60 секундэд ${p2.score} оноо цуглууллаа!`;
                summary1.classList.add('hidden');
                summary2.innerHTML = `<span class="text-rose-400">Нийт Оноо:</span> <span class="text-xl text-white">${p2.score} оноо</span>`;
            } else {
                summary1.classList.remove('hidden');
                document.getElementById('final-score-1').textContent = `${p1.score} оноо`;
                document.getElementById('final-score-2').textContent = `${p2.score} оноо`;

                const p1Title = currentMode === 'vs-ai' ? `Бот (${getDiffName(aiDifficulty)})` : 'Тоглогч 1';

                if (p1.score > p2.score) {
                    winnerTitle.textContent = `${p1Title} ЯЛАА! 🎉`;
                    winnerSub.textContent = "Илүү хурдан бөгөөд оновчтой бодлоо!";
                } else if (p2.score > p1.score) {
                    winnerTitle.textContent = "Тоглогч 2 ЯЛАА! 🎉";
                    winnerSub.textContent = "Илүү хурдан бөгөөд оновчтой бодлоо!";
                } else {
                    winnerTitle.textContent = "ТЭНЦЛЭЭ! 🤝";
                    winnerSub.textContent = "Хоёр тоглогч хоёул мундаг байлаа!";
                }
            }

            // Trigger Confetti
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        // Restart Current Game
        function restartGame() {
            startGame(currentMode);
        }

        // Quit to Main Menu
        function quitGame() {
            sound.click();
            clearInterval(gameTimer);
            clearInterval(aiLoopTimer);
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('duel-screen').classList.add('hidden');
            document.getElementById('speed-screen').classList.add('hidden');
            document.getElementById('game-over-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
